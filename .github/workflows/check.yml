name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository || contains(github.event.pull_request.labels.*.name, 'run-ci'))
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.ACTIONS_RUNNER_LABELS_CI || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Start work budget
        shell: bash
        run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (single frontend package)
        run: pnpm test
      - name: Detect Rust changes
        id: rust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git diff --name-only "$BASE_SHA" HEAD -- src-tauri/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        if: steps.rust.outputs.changed == 'true'
        working-directory: src-tauri
        shell: bash
        run: rustup show active-toolchain
      - name: Rust format check
        if: steps.rust.outputs.changed == 'true'
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Cache Rust
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri -> target
      - name: Check Rust
        if: steps.rust.outputs.changed == 'true'
        working-directory: src-tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          mkdir -p ../dist
          cargo clippy --locked --all-targets -- -D warnings
      - name: Work budget (300 seconds)
        if: always()
        shell: bash
        run: |-
          elapsed=$(( $(date +%s) - VERIFY_STARTED ))
          echo "verify: ${elapsed}s / 300s"
          [[ $elapsed -le 300 ]]
