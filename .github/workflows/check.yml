---
name: Checks
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}-${{ github.event.action == 'labeled' && 'label' || 'code' }}"
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name
      == github.repository || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      && (github.event.action != 'labeled' || github.event.label.name == 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Start work budget
      shell: bash
      run: echo "VERIFY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: ".node-version"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm lint
    - run: pnpm typecheck
    - name: Unit tests (single frontend package)
      run: pnpm test
    - name: Work budget (300 seconds)
      if: always()
      shell: bash
      run: |-
        elapsed=$(( $(date +%s) - VERIFY_STARTED ))
        echo "verify: ${elapsed}s / 300s"
        [[ $elapsed -le 300 ]]
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15
        - ubuntu-24.04
        - windows-2022
    runs-on: "${{ matrix.os }}"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: ".node-version"
        cache: pnpm
    - name: Install Linux desktop libraries
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential
        libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
    - name: Install Rust toolchain
      shell: bash
      run: rustup show active-toolchain
    - run: pnpm install --frozen-lockfile
    - run: pnpm check
    - run: pnpm build
    - run: pnpm rust:check
    - run: pnpm desktop:build -- --locked
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'run-full-ci') && (github.event.pull_request.head.repo.full_name
      == github.repository || contains(github.event.pull_request.labels.*.name, 'run-ci')))
    timeout-minutes: 30
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
  workflow_dispatch:
